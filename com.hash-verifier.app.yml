id: com.hashverifier.app
runtime: org.gnome.Platform
runtime-version: "47"
sdk: org.gnome.Sdk
command: hash-verifier
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=x11
  - --device=dri
  - --share=ipc
  - --filesystem=home:ro
  - --env=WEBKIT_DISABLE_COMPOSITING_MODE=1
modules:
  - name: binary
    buildsystem: simple
    sources:
      - type: dir
        path: images
        dest: images
      - type: file
        path: com.hashverifier.app.desktop
      - type: file
        path: com.hashverifier.app.metainfo.xml
    build-commands:
      - ar -x hash-verifier.deb
      - tar -xf data.tar.gz
      - "install -Dm755 usr/bin/hash-verifier /app/bin/hash-verifier"
      - rm -f /app/share/applications/hash-verifier.desktop
      - rm -f /app/share/applications/com.hashverifier.app.desktop
      - install -Dm644 com.hashverifier.app.desktop /app/share/applications/com.hashverifier.app.desktop
      - |
        for size in 32x32 128x128 256x256; do
          mkdir -p "/app/share/icons/hicolor/${size}/apps"
          cp "images/icons/hicolor/${size}/apps/com.hashverifier.app.png" "/app/share/icons/hicolor/${size}/apps/"
        done
      - mkdir -p "/app/share/icons/hicolor/scalable/apps"
      - cp "images/icons/hicolor/scalable/apps/com.hashverifier.app.svg" "/app/share/icons/hicolor/scalable/apps/"
