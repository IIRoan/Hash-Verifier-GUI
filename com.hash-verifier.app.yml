id: com.hash-verifier.app
runtime: org.gnome.Platform
runtime-version: "47"
sdk: org.gnome.Sdk
command: hash-verifier
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=x11
  - --device=dri
  - --share=ipc
  - --filesystem=home:ro
  - --env=WEBKIT_DISABLE_COMPOSITING_MODE=1
modules:
  - name: binary
    buildsystem: simple
    sources:
      - type: file
        path: hash-verifier.deb
      - type: dir
        path: icons
        dest: images/icons
      - type: file
        path: com.hash-verifier.app.desktop
      - type: file
        path: com.hash-verifier.app.metainfo.xml
    build-commands:
      - ar -x hash-verifier.deb
      - tar -xf data.tar.xz || tar -xf data.tar.gz
      - "install -Dm755 usr/bin/hash-verifier /app/bin/hash-verifier"
      - install -Dm644 com.hash-verifier.app.desktop /app/share/applications/com.hash-verifier.app.desktop
      - install -Dm644 com.hash-verifier.app.metainfo.xml /app/share/metainfo/com.hash-verifier.app.metainfo.xml
      - |
        for size in 32x32 128x128 256x256; do
          install -Dm644 "images/icons/hicolor/${size}/apps/com.hash-verifier.app.png" "/app/share/icons/hicolor/${size}/apps/com.hash-verifier.app.png"
        done
      - install -Dm644 "images/icons/hicolor/scalable/apps/com.hash-verifier.app.svg" "/app/share/icons/hicolor/scalable/apps/com.hash-verifier.app.svg"
