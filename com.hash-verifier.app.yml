id: com.hashverifier.app

runtime: org.gnome.Platform
runtime-version: "46"
sdk: org.gnome.Sdk

command: tauri-app
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc

modules:
  - name: binary
    buildsystem: simple
    sources:
      - type: file
        url: https://github.com/IIRoan/Hash-Verifier-GUI/releases/download/0.01/hash-verifier_0.1.0_amd64.deb
        sha256: 95d7da886d389e069418c5ebb5065e526b893477c5e8749bd9c672ea44bde8eb
        only-arches: [x86_64]
    build-commands:
      - ar -x *.deb
      - tar -xf data.tar.gz
      - "install -Dm755 usr/bin/tauri-app /app/bin/tauri-app"
      - install -Dm644 usr/share/applications/yourapp.desktop /app/share/applications/org.your.id.desktop
      - install -Dm644 usr/share/icons/hicolor/128x128/apps/yourapp.png /app/share/icons/hicolor/128x128/apps/org.your.id.png
      - install -Dm644 usr/share/icons/hicolor/32x32/apps/yourapp.png /app/share/icons/hicolor/32x32/apps/org.your.id.png
      - install -Dm644 usr/share/icons/hicolor/256x256@2/apps/yourapp.png /app/share/icons/hicolor/256x256@2/apps/org.your.id.png
      - install -Dm644 org.your.id.metainfo.xml /app/share/metainfo/org.your.id.metainfo.xml
